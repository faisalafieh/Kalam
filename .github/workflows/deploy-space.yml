# Deploys the Kalam API to a free Hugging Face Space (Docker, CPU basic).
#
# One-time setup:
#   1. Hugging Face: create an account, accept the terms on
#      pyannote/speaker-diarization-3.1 and pyannote/segmentation-3.0,
#      then create an access token with WRITE permission.
#   2. GitHub repo -> Settings -> Secrets and variables -> Actions:
#      add secret HF_TOKEN = that token.
#      Optional: secret PYANNOTE_TOKEN = a separate READ token for the running
#      Space (otherwise HF_TOKEN is reused); variable ALLOWED_ORIGINS = your
#      frontend URL; variable ARABIC_MODEL (default large-v3-turbo).
#   3. Actions tab -> "Deploy to Hugging Face Space" -> Run workflow.
# After that, every push to main redeploys automatically.

name: Deploy to Hugging Face Space

on:
  push:
    branches: [main]
    paths: ["app.py", "arabic.py", "requirements.txt", "Dockerfile", ".github/workflows/deploy-space.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check token
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::Add a Hugging Face write token as the HF_TOKEN repository secret (see the top of this file)."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install "huggingface_hub>=0.25,<1.0"

      - name: Create or update the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PYANNOTE_TOKEN: ${{ secrets.PYANNOTE_TOKEN }}
          ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
          ARABIC_MODEL: ${{ vars.ARABIC_MODEL }}
          SPACE_NAME: ${{ vars.SPACE_NAME }}
        run: |
          python - <<'PY'
          import os, shutil, tempfile
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          user = api.whoami()["name"]
          repo_id = f"{user}/{os.environ.get('SPACE_NAME') or 'kalam'}"

          api.create_repo(repo_id, repo_type="space", space_sdk="docker", exist_ok=True)

          stage = tempfile.mkdtemp()
          for f in ("Dockerfile", "app.py", "arabic.py", "requirements.txt"):
              shutil.copy(f, stage)
          with open(os.path.join(stage, "README.md"), "w") as fh:
              fh.write(
                  "---\n"
                  "title: Kalam\n"
                  "emoji: 🎙️\n"
                  "colorFrom: gray\n"
                  "colorTo: blue\n"
                  "sdk: docker\n"
                  "app_port: 8000\n"
                  "pinned: false\n"
                  "---\n\n"
                  "Kalam: speaker-attributed transcription API. Deployed from "
                  "https://github.com/faisalafieh/Kalam by GitHub Actions; edit there, not here.\n"
              )

          api.add_space_secret(repo_id, "HF_TOKEN", os.environ.get("PYANNOTE_TOKEN") or os.environ["HF_TOKEN"])
          api.add_space_variable(repo_id, "ALLOWED_ORIGINS", os.environ.get("ALLOWED_ORIGINS") or "*")
          api.add_space_variable(repo_id, "ARABIC_MODEL", os.environ.get("ARABIC_MODEL") or "large-v3-turbo")

          api.upload_folder(folder_path=stage, repo_id=repo_id, repo_type="space",
                            commit_message=f"Deploy {os.environ.get('GITHUB_SHA', '')[:7]}")

          host = repo_id.lower().replace("/", "-").replace("_", "-").replace(".", "-")
          url = f"https://{host}.hf.space"
          print(f"Space: https://huggingface.co/spaces/{repo_id}")
          print(f"API:   {url}  (health check: {url}/health)")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as s:
              s.write(f"### Deployed\n\n- Space: https://huggingface.co/spaces/{repo_id}\n"
                      f"- API: {url}\n- Health check: {url}/health\n\n"
                      "The first build takes about 10 minutes.\n")
          PY
